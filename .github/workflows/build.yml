name: Build Android APK

on:
  push:
    branches: [ "main", "feature/pro-editor-foundation" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Lint
        run: ./gradlew lintDebug --stacktrace --no-daemon
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dok-editor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dok-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  device-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Android instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot
          script: ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dok-instrumented-test-reports
          path: '**/build/outputs/androidTest-results/**'
          if-no-files-found: ignore
          retention-days: 7
